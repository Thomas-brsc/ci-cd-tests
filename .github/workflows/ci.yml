name: CI/CD Dev + Prod + Discord + Security

on:
  push:
    tags:
      - 'dev-*'
      - 'prod-*'

jobs:
  build:                      
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm install
      - run: npm run lint
      - run: npm test

      # 🔍 SCA - Audit librairies (npm audit)
      - name: SCA - Audit dependencies
        run: npm audit --audit-level=high

      # 🔍 SAST - Analyse code source avec SonarCloud (exemple)
      # - name: SAST - Scan code source
        # uses: sonarsource/sonarcloud-github-action@v2
        # with:
          # projectKey: ${{ secrets.SONAR_PROJECT_KEY }}
          # organization: ${{ secrets.SONAR_ORG }}
          # token: ${{ secrets.SONAR_TOKEN }} 

  deploy-dev:                  
    if: startsWith(github.ref, 'refs/tags/dev-')
    runs-on: ubuntu-latest
    needs: build               
    steps:
      - name: Deploy to Render
        uses: ttskch/render-deploy@v1.0.0
        with:
          apiKey: ${{ secrets.RENDER_API_KEY }}
          serviceId: ${{ secrets.RENDER_SERVICE_ID }}

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/prod-')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Railway
        uses: railwayapp/railway-action@v1
        with:
          apiKey: ${{ secrets.RAILWAY_API_KEY }}
          projectId: ${{ secrets.RAILWAY_PROJECT_ID }}
          serviceName: "production"

      - name: Discord notification
        uses: peter-evans/discord-webhook@v1
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          message: |
            Repository : ${{ github.repository }}
            Ref : ${{ github.ref_name }}
            Build terminé ⚡
