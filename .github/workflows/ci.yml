name: Ma première CI/CD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy sur Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.SERVICE_ID }}
          api-key: ${{ secrets.API_KEY }}

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()   # s'exécute même si deploy échoue
    steps:
      - name: Envoyer notif Discord
        run: |
          # Récupère le statut du job deploy
          STATUS="🛠️ Build terminé impeccable"
          if [ "${{ needs.deploy.result }}" != "success" ]; then
            STATUS="❌ Pipeline FAILED ! Vérifiez les logs."
          fi

          # Envoi via curl
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\":\"Test ci/cd\nAPP\n$STATUS\nRepo : $GITHUB_REPOSITORY\nRef : $GITHUB_REF_NAME\"}" \
               ${{ secrets.DISCORD_WEBHOOK }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
